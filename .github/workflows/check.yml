name: Check skills
on:
  # PRs into `epic/*` integration branches run no CI (control C56): ATC merges
  # children on its own `Autop / …` statuses, and the epic release PR into
  # main carries the whole integration through these gates.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install PyYAML
      - run: python .github/check.py
      - run: python .github/test_check.py -v
      - run: python .github/test_discovery.py -v
      - run: python .github/test_questions.py -v
