name: Check skills
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install PyYAML
      - run: python .github/check.py
      - run: python .github/test_check.py -v
      - run: python .github/test_discovery.py -v
